var FIRMWARE_INO = "/*\r\n * VW Golf 2 19E GTI - AAA VR6 Tacho-Signalwandler\r\n * Arduino Nano V3 - Kalibrierung per Potentiometer\r\n *\r\n * Eingänge (Signal via Optokoppler/Spannungsteiler! 12V -> 5V):\r\n *   D2 (INT0) = Motronic RPM-Signal\r\n *   D3 (INT1) = Getriebe VSS Hall-Sensor Signal\r\n *\r\n * Ausgänge (via NPN-Transistor Open-Collector Treiber):\r\n *   D9  (OC1A) = korrigiertes RPM-Signal -> Tacho\r\n *   D11 (OC2A) = korrigiertes Speed-Signal -> Tacho\r\n *\r\n * Kalibrierung:\r\n *   A0 = Poti Drehzahl-Trimmer (10k linear)\r\n *   A1 = Poti Speed-Faktor (10k linear)\r\n *   D4 = Taster (Kalibrierung sperren/speichern), mit INPUT_PULLUP\r\n *   D13 = LED (an = gesperrt/gespeichert, aus = Live-Poti-Modus)\r\n *\r\n * Kurzer Tastendruck (<1s)  = Sperren <-> Freigeben umschalten\r\n * Langer Tastendruck (>=2s) = Reset auf Standardwerte\r\n */\r\n\r\n#include <EEPROM.h>\r\n\r\n// ---------- Kalibrierbereiche ----------\r\nconst float RPM_FACTOR_MIN   = 0.40;\r\nconst float RPM_FACTOR_MAX   = 1.00;   // theoretisch: 2/3 = 0.667 -> mittig im Bereich\r\nconst float SPEED_FACTOR_MIN = 0.30;\r\nconst float SPEED_FACTOR_MAX = 3.00;\r\nconst float RPM_FACTOR_DEFAULT   = 2.0 / 3.0;\r\nconst float SPEED_FACTOR_DEFAULT = 1.0;\r\n\r\n// ---------- Pins ----------\r\nconst int PIN_RPM_IN    = 2;\r\nconst int PIN_SPEED_IN  = 3;\r\nconst int PIN_RPM_OUT   = 9;\r\nconst int PIN_SPEED_OUT = 11;\r\nconst int PIN_POTI_RPM   = A0;\r\nconst int PIN_POTI_SPEED = A1;\r\nconst int PIN_BUTTON = 4;\r\nconst int PIN_LED    = 13;\r\n\r\n// ---------- EEPROM Layout ----------\r\nstruct CalData {\r\n  float rpmFactor;\r\n  float speedFactor;\r\n  byte  locked; // 1 = gesperrt/gespeichert, 0 = frei/live\r\n};\r\nconst int EEPROM_ADDR = 0;\r\nCalData cal;\r\n\r\n// ---------- Eingangs-Erfassung ----------\r\nvolatile unsigned long lastRpmPulse = 0;\r\nvolatile unsigned long rpmPeriod = 0;\r\nvolatile unsigned long lastSpeedPulse = 0;\r\nvolatile unsigned long speedPeriod = 0;\r\nconst unsigned long TIMEOUT_US = 500000UL;\r\n\r\nvoid rpmISR() {\r\n  unsigned long now = micros();\r\n  rpmPeriod = now - lastRpmPulse;\r\n  lastRpmPulse = now;\r\n}\r\nvoid speedISR() {\r\n  unsigned long now = micros();\r\n  speedPeriod = now - lastSpeedPulse;\r\n  lastSpeedPulse = now;\r\n}\r\n\r\n// ---------- Timer1 (RPM Ausgang, Pin D9) ----------\r\nvoid setTimer1Frequency(float freqHz) {\r\n  if (freqHz < 1.0) { TCCR1A = 0; digitalWrite(PIN_RPM_OUT, LOW); return; }\r\n  long prescaler = 8; byte csBits = 0b010;\r\n  long ocrVal = (F_CPU / (2.0 * prescaler * freqHz)) - 1;\r\n  if (ocrVal > 65535) { prescaler = 64; csBits = 0b011;\r\n    ocrVal = (F_CPU / (2.0 * prescaler * freqHz)) - 1; }\r\n  ocrVal = constrain(ocrVal, 1, 65535);\r\n  TCCR1A = (1 << COM1A0);\r\n  TCCR1B = (1 << WGM12) | csBits;\r\n  OCR1A = (unsigned int)ocrVal;\r\n}\r\n\r\n// ---------- Timer2 (Speed Ausgang, Pin D11) ----------\r\nvoid setTimer2Frequency(float freqHz) {\r\n  if (freqHz < 1.0) { TCCR2A = 0; digitalWrite(PIN_SPEED_OUT, LOW); return; }\r\n  long prescaler = 64; byte csBits = 0b100;\r\n  long ocrVal = (F_CPU / (2.0 * prescaler * freqHz)) - 1;\r\n  if (ocrVal > 255) { prescaler = 256; csBits = 0b110;\r\n    ocrVal = (F_CPU / (2.0 * prescaler * freqHz)) - 1; }\r\n  ocrVal = constrain(ocrVal, 1, 255);\r\n  TCCR2A = (1 << COM2A0) | (1 << WGM21);\r\n  TCCR2B = csBits;\r\n  OCR2A = (byte)ocrVal;\r\n}\r\n\r\n// ---------- Poti glätten (Moving Average) ----------\r\nfloat smoothRpmPoti = 0, smoothSpeedPoti = 0;\r\nconst float ALPHA = 0.05; // Glättungsfaktor\r\n\r\nfloat readSmoothedPoti(int pin, float &smoothVal) {\r\n  int raw = analogRead(pin);\r\n  smoothVal = smoothVal + ALPHA * ((float)raw - smoothVal);\r\n  return smoothVal;\r\n}\r\n\r\n// ---------- Button Handling ----------\r\nbool lastButtonState = HIGH;\r\nunsigned long buttonPressStart = 0;\r\nbool longPressHandled = false;\r\n\r\nvoid handleButton() {\r\n  bool state = digitalRead(PIN_BUTTON);\r\n  if (state == LOW && lastButtonState == HIGH) {\r\n    buttonPressStart = millis();\r\n    longPressHandled = false;\r\n  }\r\n  if (state == LOW && !longPressHandled) {\r\n    if (millis() - buttonPressStart >= 2000) {\r\n      // Langer Druck -> Reset\r\n      cal.rpmFactor = RPM_FACTOR_DEFAULT;\r\n      cal.speedFactor = SPEED_FACTOR_DEFAULT;\r\n      cal.locked = 0;\r\n      EEPROM.put(EEPROM_ADDR, cal);\r\n      longPressHandled = true;\r\n      Serial.println(\"RESET auf Standardwerte!\");\r\n    }\r\n  }\r\n  if (state == HIGH && lastButtonState == LOW && !longPressHandled) {\r\n    // Kurzer Druck -> Sperren/Freigeben umschalten\r\n    cal.locked = !cal.locked;\r\n    if (cal.locked) {\r\n      EEPROM.put(EEPROM_ADDR, cal);\r\n      Serial.println(\"Kalibrierung GESPERRT & gespeichert.\");\r\n    } else {\r\n      Serial.println(\"Kalibrierung FREIGEGEBEN (Poti aktiv).\");\r\n    }\r\n  }\r\n  lastButtonState = state;\r\n}\r\n\r\nvoid setup() {\r\n  pinMode(PIN_RPM_IN, INPUT_PULLUP);\r\n  pinMode(PIN_SPEED_IN, INPUT_PULLUP);\r\n  pinMode(PIN_RPM_OUT, OUTPUT);\r\n  pinMode(PIN_SPEED_OUT, OUTPUT);\r\n  pinMode(PIN_BUTTON, INPUT_PULLUP);\r\n  pinMode(PIN_LED, OUTPUT);\r\n\r\n  attachInterrupt(digitalPinToInterrupt(PIN_RPM_IN), rpmISR, FALLING);\r\n  attachInterrupt(digitalPinToInterrupt(PIN_SPEED_IN), speedISR, FALLING);\r\n\r\n  Serial.begin(9600);\r\n  EEPROM.get(EEPROM_ADDR, cal);\r\n  if (isnan(cal.rpmFactor) || cal.rpmFactor <= 0 || cal.rpmFactor > RPM_FACTOR_MAX ||\r\n      isnan(cal.speedFactor) || cal.speedFactor <= 0 || cal.speedFactor > SPEED_FACTOR_MAX) {\r\n    cal.rpmFactor = RPM_FACTOR_DEFAULT;\r\n    cal.speedFactor = SPEED_FACTOR_DEFAULT;\r\n    cal.locked = 0;\r\n  }\r\n  if (cal.locked != 0 && cal.locked != 1) cal.locked = 0;\r\n  Serial.println(\"=== Golf 2 VR6 Tacho-Signalwandler (Poti-Kalibrierung) ===\");\r\n  Serial.print(\"Status: \"); Serial.println(cal.locked ? \"GESPERRT\" : \"LIVE (Poti)\");\r\n}\r\n\r\nvoid loop() {\r\n  unsigned long now = micros();\r\n  handleButton();\r\n  digitalWrite(PIN_LED, cal.locked ? HIGH : LOW);\r\n\r\n  // --- Faktor bestimmen: Poti live ODER gespeicherter Wert ---\r\n  if (!cal.locked) {\r\n    float pR = readSmoothedPoti(PIN_POTI_RPM, smoothRpmPoti) / 1023.0;\r\n    float pS = readSmoothedPoti(PIN_POTI_SPEED, smoothSpeedPoti) / 1023.0;\r\n    cal.rpmFactor   = RPM_FACTOR_MIN   + pR * (RPM_FACTOR_MAX - RPM_FACTOR_MIN);\r\n    cal.speedFactor = SPEED_FACTOR_MIN + pS * (SPEED_FACTOR_MAX - SPEED_FACTOR_MIN);\r\n  }\r\n\r\n  // --- RPM Signal verarbeiten ---\r\n  unsigned long rp; unsigned long lastR;\r\n  noInterrupts(); rp = rpmPeriod; lastR = lastRpmPulse; interrupts();\r\n  if (now - lastR > TIMEOUT_US) setTimer1Frequency(0);\r\n  else if (rp > 0) setTimer1Frequency((1000000.0 / rp) * cal.rpmFactor);\r\n\r\n  // --- Speed Signal verarbeiten ---\r\n  unsigned long sp; unsigned long lastS;\r\n  noInterrupts(); sp = speedPeriod; lastS = lastSpeedPulse; interrupts();\r\n  if (now - lastS > TIMEOUT_US) setTimer2Frequency(0);\r\n  else if (sp > 0) setTimer2Frequency((1000000.0 / sp) * cal.speedFactor);\r\n\r\n  // --- Debug-Ausgabe alle 500ms ---\r\n  static unsigned long lastPrint = 0;\r\n  if (millis() - lastPrint > 500) {\r\n    lastPrint = millis();\r\n    Serial.print(\"RPM-Faktor: \"); Serial.print(cal.rpmFactor, 4);\r\n    Serial.print(\" | Speed-Faktor: \"); Serial.print(cal.speedFactor, 4);\r\n    Serial.print(\" | Status: \"); Serial.println(cal.locked ? \"GESPERRT\" : \"LIVE\");\r\n  }\r\n}";

var VSS_OPTS = [{"id":"gala","titel":"Option A: GALA-Hallgeber am Tacho (EMPFOHLEN – einfachste Lösung)","schwierigkeit":"Einfach","kosten":"~30–65 €","voraussetzung":"Tachowelle muss mechanisch angetrieben sein (02A-Getriebe hat Tachowellen-Anschluss)","beschreibung":"Der GALA-Hallgeber (321 907 345 B) wird direkt in den Tacho eingeschraubt und tastet die rotierende Magnetscheibe im Tacho ab. Er gibt 4 Impulse pro Tachowellenumdrehung aus – das ist exakt das richtige Signal für Tacho und ECU. Kein Arduino, kein Schaltplan, kein Programmieren.","teile":[{"bezeichnung":"GALA-Hallgeber VW Golf 2","teilenummer":"321 907 345 B","preis":"~30–65 € (gebraucht/NOS)"},{"bezeichnung":"Leiterfolie / Flachbandkabel (im Lieferumfang)","teilenummer":"–","preis":"–"}],"schritte":[{"nr":1,"text":"Tacho ausbauen. Auf der Rückseite die Verschlusslasche der Tachowellen-Öffnung entfernen."},{"nr":2,"text":"Hallgeber 321 907 345 B einschrauben (M-Gewinde, selbstsichernd). Leiterfolie in den Tacho einstecken und befestigen.","kabel":"Kabel 1 (Braun): Masse | Kabel 2 (Rot): 12V Kl.15 | Kabel 3 (Weiß/Gelb): Signal"},{"nr":3,"text":"Signal-Kabel (Weiß/Gelb) an ZE G1/11 anschließen → intern zu U1/11 → T28/27 (VSS-Eingang Tacho).","kabel":"Weiß/Gelb → ZE G1/11 (Weiß/Blau) → U1/11 → T28/27"},{"nr":4,"text":"ECU über Standard-Pfad versorgen: Tacho-Ausgang T28/07 (Violett) → U2/02 → ECU Pin 65 (Blau/Weiß). KEIN Direktabgriff vom Geber – der Tacho bereitet das GALA-Signal auf. Ausnahme nur ohne Tacho/MFA: Signal parallel abgreifen – WARNUNG: Pegelbelastung/Rückwirkung möglich, Standard-Pfad bevorzugen!","kabel":"T28/07 (Violett) → U2/02 → ECU Pin 65 (Blau/Weiß) [Standard] | Parallel-Abgriff nur als Ausnahme!"},{"nr":5,"text":"12V (Rot) an Klemme 15 (Zündungsplus) anschließen. Masse (Braun) an Fahrzeugmasse.","kabel":"Rot → Si. 16 oder ZE U1/04 | Braun → Karosseriemasse"},{"nr":6,"text":"Tacho einbauen, Zündung EIN. Bei Fahrt: Tacho zeigt Geschwindigkeit, ECU-Messblock Gruppe 3 zeigt VSS-Wert."}]},{"id":"arduino","titel":"Option B: Arduino Nano V3 (ATMega328P) v1.0 – 2-Kanal DZM+VSS-Wandler","schwierigkeit":"Mittel","kosten":"~4–8 €","voraussetzung":"Arduino Nano V3 vorhanden. Keine Tachowelle nötig – liest ABS-Radsensor direkt.","beschreibung":"Zweikanal-Wandler v1.0 (Firmware tacho.ino): Motronic-DZM an D2 (INT0) und VSS-Hall an D3 (INT1) werden über Optokoppler/Spannungsteiler (12V→5V, INPUT_PULLUP, FALLING-Flanke) eingelesen. Timer1 (D9/OC1A) gibt korrigiertes RPM, Timer2 (D11/OC2A) korrigiertes Speed über NPN-Open-Collector aus. Kalibrierung per Poti A0 (RPM 0,40–1,00, Default 2/3) und A1 (Speed 0,30–3,00, Default 1,0, geglättet); Taster D4 (kurz=sperren/freigeben+EEPROM, lang≥2s=Reset), LED D13 zeigt Sperrstatus. WICHTIG: Standard ATMega328P funktioniert – kein 328PB nötig!","teile":[{"bezeichnung":"Arduino Nano V3 (ATMega328P)","teilenummer":"–","preis":"~4–8 €"},{"bezeichnung":"PC817 Optokoppler ×2 (Eingänge D2/D3, 12V→5V, galvanisch getrennt)","teilenummer":"PC817","preis":"~0,40 €"},{"bezeichnung":"Poti 10k linear ×2 (A0=RPM-Trimmer, A1=Speed-Faktor)","teilenummer":"–","preis":"~1,00 €"},{"bezeichnung":"Taster (D4 nach GND, INPUT_PULLUP)","teilenummer":"–","preis":"~0,20 €"},{"bezeichnung":"Transistor BC547 NPN ×2 (Ausgänge D9/D11 Open-Collector, Timer1/Timer2)","teilenummer":"BC547B","preis":"~0,20 €"},{"bezeichnung":"Widerstände (Basis 1kΩ, Pull-ups 10kΩ) + 7805-Spannungsregler","teilenummer":"–","preis":"~0,80 €"},{"bezeichnung":"Lochrasterplatine + Schraubklemmen 2-polig 5mm","teilenummer":"–","preis":"~3,00 €"}],"schritte":[{"nr":1,"text":"Eingänge aufbauen (Optokoppler, galvanisch getrennt): Motronic-DZM (12V) über Spannungsteiler/Vorwiderstand an PC817-LED (12V-Seite) → PC817-Transistor (5V-Seite, Pull-up 5V) an Arduino D2 (INT0, INPUT_PULLUP, FALLING). Gleicher Pfad für VSS-Hall an D3 (INT1). Arduino-GND und Bordnetz-GND an den Eingängen über Optokoppler getrennt.","kabel":"Motronic-DZM → PC817 (12V-Seite) → D2 (INT0) | VSS-Hall → PC817 → D3 (INT1) | 5V-Seite: Pull-up 5V, FALLING"},{"nr":2,"text":"Ausgangsstufe aufbauen (PC817, galvanisch getrennt): 5V-Seite: Arduino D9 (Timer1) über 1kΩ an PC817-LED Anode, Kathode an Arduino-GND; gleich für D11 (Timer2) an zweiten PC817. 12V-Seite: PC817-Transistor Emitter an Bordnetz-GND, Kollektor über 10kΩ Pull-up an 12V (Kl.15) → Kollektor-Ausgang via NPN/BC547-Open-Collector an T28/27 (VSS-Eingang Tacho). WICHTIG: Arduino-Masse (5V-Seite) und Bordnetz-Masse (12V-Seite) NICHT verbinden – galvanisch getrennt, sonst Masseschleifen/Spannungsspitzen!","kabel":"5V-Seite: D9 → 1kΩ → PC817-LED → Arduino-GND | D11 → 1kΩ → PC817-LED → Arduino-GND || 12V-Seite: PC817-Transistor → BC547 → 10kΩ → 12V → T28/27 | Massen NICHT verbunden!"},{"nr":3,"text":"Sensor hochohmig am ABS-SG abgreifen (VR-Paar NICHT belasten, NICHT auf Masse legen): ABS-SG Pin 5 (Braun, Signal+) und ABS-SG Pin 23 (Braun-Weiß, Rückleitung) als differenzielles Paar über hochohmigen Optokoppler/Spannungsteiler an D3-Pfad führen. Verdrillte Leitung beibehalten, keinen Leiter nach Masse kurzschließen.","kabel":"ABS-SG Pin 5 (Braun, Signal+) → hochohmig → D3-Pfad (VSS) | ABS-SG Pin 23 (Braun-Weiß, Rückleitung) → hochohmig → Referenz, NICHT auf Masse!"},{"nr":4,"text":"Arduino versorgen: 12V über 7805-Spannungsregler an Arduino 5V-Pin (7805 liefert 5 V – NICHT an VIN, der braucht 7–12 V!). GND an Fahrzeugmasse.","kabel":"12V (Kl.15) → 7805 → Arduino 5V (NICHT VIN!) | GND → Fahrzeugmasse"},{"nr":5,"text":"Firmware v1.0 (tacho.ino, Code siehe unten) laden: 2 Kanäle D2/D3→D9/D11 (FALLING, Timer1/Timer2), Faktoren per Poti A0 (RPM_FACTOR 0,40–1,00, Default 2/3, MAX als Konstante) und A1 (SPEED_FACTOR 0,30–3,00, Default 1,0), Speicherung per Taster D4 in EEPROM (locked-Normierung). Nicht mehr per float-FAKTOR im Code – per Poti + GPS gegenmessen!"},{"nr":6,"text":"Testen: Zündung EIN, Rad drehen → D13-LED zeigt Sperrstatus (an=gesperrt/gespeichert, aus=Live-Poti). Kurz Tastendruck D4=sperren/freigeben, lang (≥2s)=Reset. Bei Fahrt: Tacho + ECU-Messblock Gruppe 3 prüfen, Faktoren per GPS gegenmessen."}],"firmware":"/*\r\n * VW Golf 2 19E GTI - AAA VR6 Tacho-Signalwandler\r\n * Arduino Nano V3 - Kalibrierung per Potentiometer\r\n *\r\n * Eingänge (Signal via Optokoppler/Spannungsteiler! 12V -> 5V):\r\n *   D2 (INT0) = Motronic RPM-Signal\r\n *   D3 (INT1) = Getriebe VSS Hall-Sensor Signal\r\n *\r\n * Ausgänge (via NPN-Transistor Open-Collector Treiber):\r\n *   D9  (OC1A) = korrigiertes RPM-Signal -> Tacho\r\n *   D11 (OC2A) = korrigiertes Speed-Signal -> Tacho\r\n *\r\n * Kalibrierung:\r\n *   A0 = Poti Drehzahl-Trimmer (10k linear)\r\n *   A1 = Poti Speed-Faktor (10k linear)\r\n *   D4 = Taster (Kalibrierung sperren/speichern), mit INPUT_PULLUP\r\n *   D13 = LED (an = gesperrt/gespeichert, aus = Live-Poti-Modus)\r\n *\r\n * Kurzer Tastendruck (<1s)  = Sperren <-> Freigeben umschalten\r\n * Langer Tastendruck (>=2s) = Reset auf Standardwerte\r\n */\r\n\r\n#include <EEPROM.h>\r\n\r\n// ---------- Kalibrierbereiche ----------\r\nconst float RPM_FACTOR_MIN   = 0.40;\r\nconst float RPM_FACTOR_MAX   = 1.00;   // theoretisch: 2/3 = 0.667 -> mittig im Bereich\r\nconst float SPEED_FACTOR_MIN = 0.30;\r\nconst float SPEED_FACTOR_MAX = 3.00;\r\nconst float RPM_FACTOR_DEFAULT   = 2.0 / 3.0;\r\nconst float SPEED_FACTOR_DEFAULT = 1.0;\r\n\r\n// ---------- Pins ----------\r\nconst int PIN_RPM_IN    = 2;\r\nconst int PIN_SPEED_IN  = 3;\r\nconst int PIN_RPM_OUT   = 9;\r\nconst int PIN_SPEED_OUT = 11;\r\nconst int PIN_POTI_RPM   = A0;\r\nconst int PIN_POTI_SPEED = A1;\r\nconst int PIN_BUTTON = 4;\r\nconst int PIN_LED    = 13;\r\n\r\n// ---------- EEPROM Layout ----------\r\nstruct CalData {\r\n  float rpmFactor;\r\n  float speedFactor;\r\n  byte  locked; // 1 = gesperrt/gespeichert, 0 = frei/live\r\n};\r\nconst int EEPROM_ADDR = 0;\r\nCalData cal;\r\n\r\n// ---------- Eingangs-Erfassung ----------\r\nvolatile unsigned long lastRpmPulse = 0;\r\nvolatile unsigned long rpmPeriod = 0;\r\nvolatile unsigned long lastSpeedPulse = 0;\r\nvolatile unsigned long speedPeriod = 0;\r\nconst unsigned long TIMEOUT_US = 500000UL;\r\n\r\nvoid rpmISR() {\r\n  unsigned long now = micros();\r\n  rpmPeriod = now - lastRpmPulse;\r\n  lastRpmPulse = now;\r\n}\r\nvoid speedISR() {\r\n  unsigned long now = micros();\r\n  speedPeriod = now - lastSpeedPulse;\r\n  lastSpeedPulse = now;\r\n}\r\n\r\n// ---------- Timer1 (RPM Ausgang, Pin D9) ----------\r\nvoid setTimer1Frequency(float freqHz) {\r\n  if (freqHz < 1.0) { TCCR1A = 0; digitalWrite(PIN_RPM_OUT, LOW); return; }\r\n  long prescaler = 8; byte csBits = 0b010;\r\n  long ocrVal = (F_CPU / (2.0 * prescaler * freqHz)) - 1;\r\n  if (ocrVal > 65535) { prescaler = 64; csBits = 0b011;\r\n    ocrVal = (F_CPU / (2.0 * prescaler * freqHz)) - 1; }\r\n  ocrVal = constrain(ocrVal, 1, 65535);\r\n  TCCR1A = (1 << COM1A0);\r\n  TCCR1B = (1 << WGM12) | csBits;\r\n  OCR1A = (unsigned int)ocrVal;\r\n}\r\n\r\n// ---------- Timer2 (Speed Ausgang, Pin D11) ----------\r\nvoid setTimer2Frequency(float freqHz) {\r\n  if (freqHz < 1.0) { TCCR2A = 0; digitalWrite(PIN_SPEED_OUT, LOW); return; }\r\n  long prescaler = 64; byte csBits = 0b100;\r\n  long ocrVal = (F_CPU / (2.0 * prescaler * freqHz)) - 1;\r\n  if (ocrVal > 255) { prescaler = 256; csBits = 0b110;\r\n    ocrVal = (F_CPU / (2.0 * prescaler * freqHz)) - 1; }\r\n  ocrVal = constrain(ocrVal, 1, 255);\r\n  TCCR2A = (1 << COM2A0) | (1 << WGM21);\r\n  TCCR2B = csBits;\r\n  OCR2A = (byte)ocrVal;\r\n}\r\n\r\n// ---------- Poti glätten (Moving Average) ----------\r\nfloat smoothRpmPoti = 0, smoothSpeedPoti = 0;\r\nconst float ALPHA = 0.05; // Glättungsfaktor\r\n\r\nfloat readSmoothedPoti(int pin, float &smoothVal) {\r\n  int raw = analogRead(pin);\r\n  smoothVal = smoothVal + ALPHA * ((float)raw - smoothVal);\r\n  return smoothVal;\r\n}\r\n\r\n// ---------- Button Handling ----------\r\nbool lastButtonState = HIGH;\r\nunsigned long buttonPressStart = 0;\r\nbool longPressHandled = false;\r\n\r\nvoid handleButton() {\r\n  bool state = digitalRead(PIN_BUTTON);\r\n  if (state == LOW && lastButtonState == HIGH) {\r\n    buttonPressStart = millis();\r\n    longPressHandled = false;\r\n  }\r\n  if (state == LOW && !longPressHandled) {\r\n    if (millis() - buttonPressStart >= 2000) {\r\n      // Langer Druck -> Reset\r\n      cal.rpmFactor = RPM_FACTOR_DEFAULT;\r\n      cal.speedFactor = SPEED_FACTOR_DEFAULT;\r\n      cal.locked = 0;\r\n      EEPROM.put(EEPROM_ADDR, cal);\r\n      longPressHandled = true;\r\n      Serial.println(\"RESET auf Standardwerte!\");\r\n    }\r\n  }\r\n  if (state == HIGH && lastButtonState == LOW && !longPressHandled) {\r\n    // Kurzer Druck -> Sperren/Freigeben umschalten\r\n    cal.locked = !cal.locked;\r\n    if (cal.locked) {\r\n      EEPROM.put(EEPROM_ADDR, cal);\r\n      Serial.println(\"Kalibrierung GESPERRT & gespeichert.\");\r\n    } else {\r\n      Serial.println(\"Kalibrierung FREIGEGEBEN (Poti aktiv).\");\r\n    }\r\n  }\r\n  lastButtonState = state;\r\n}\r\n\r\nvoid setup() {\r\n  pinMode(PIN_RPM_IN, INPUT_PULLUP);\r\n  pinMode(PIN_SPEED_IN, INPUT_PULLUP);\r\n  pinMode(PIN_RPM_OUT, OUTPUT);\r\n  pinMode(PIN_SPEED_OUT, OUTPUT);\r\n  pinMode(PIN_BUTTON, INPUT_PULLUP);\r\n  pinMode(PIN_LED, OUTPUT);\r\n\r\n  attachInterrupt(digitalPinToInterrupt(PIN_RPM_IN), rpmISR, FALLING);\r\n  attachInterrupt(digitalPinToInterrupt(PIN_SPEED_IN), speedISR, FALLING);\r\n\r\n  Serial.begin(9600);\r\n  EEPROM.get(EEPROM_ADDR, cal);\r\n  if (isnan(cal.rpmFactor) || cal.rpmFactor <= 0 || cal.rpmFactor > RPM_FACTOR_MAX ||\r\n      isnan(cal.speedFactor) || cal.speedFactor <= 0 || cal.speedFactor > SPEED_FACTOR_MAX) {\r\n    cal.rpmFactor = RPM_FACTOR_DEFAULT;\r\n    cal.speedFactor = SPEED_FACTOR_DEFAULT;\r\n    cal.locked = 0;\r\n  }\r\n  if (cal.locked != 0 && cal.locked != 1) cal.locked = 0;\r\n  Serial.println(\"=== Golf 2 VR6 Tacho-Signalwandler (Poti-Kalibrierung) ===\");\r\n  Serial.print(\"Status: \"); Serial.println(cal.locked ? \"GESPERRT\" : \"LIVE (Poti)\");\r\n}\r\n\r\nvoid loop() {\r\n  unsigned long now = micros();\r\n  handleButton();\r\n  digitalWrite(PIN_LED, cal.locked ? HIGH : LOW);\r\n\r\n  // --- Faktor bestimmen: Poti live ODER gespeicherter Wert ---\r\n  if (!cal.locked) {\r\n    float pR = readSmoothedPoti(PIN_POTI_RPM, smoothRpmPoti) / 1023.0;\r\n    float pS = readSmoothedPoti(PIN_POTI_SPEED, smoothSpeedPoti) / 1023.0;\r\n    cal.rpmFactor   = RPM_FACTOR_MIN   + pR * (RPM_FACTOR_MAX - RPM_FACTOR_MIN);\r\n    cal.speedFactor = SPEED_FACTOR_MIN + pS * (SPEED_FACTOR_MAX - SPEED_FACTOR_MIN);\r\n  }\r\n\r\n  // --- RPM Signal verarbeiten ---\r\n  unsigned long rp; unsigned long lastR;\r\n  noInterrupts(); rp = rpmPeriod; lastR = lastRpmPulse; interrupts();\r\n  if (now - lastR > TIMEOUT_US) setTimer1Frequency(0);\r\n  else if (rp > 0) setTimer1Frequency((1000000.0 / rp) * cal.rpmFactor);\r\n\r\n  // --- Speed Signal verarbeiten ---\r\n  unsigned long sp; unsigned long lastS;\r\n  noInterrupts(); sp = speedPeriod; lastS = lastSpeedPulse; interrupts();\r\n  if (now - lastS > TIMEOUT_US) setTimer2Frequency(0);\r\n  else if (sp > 0) setTimer2Frequency((1000000.0 / sp) * cal.speedFactor);\r\n\r\n  // --- Debug-Ausgabe alle 500ms ---\r\n  static unsigned long lastPrint = 0;\r\n  if (millis() - lastPrint > 500) {\r\n    lastPrint = millis();\r\n    Serial.print(\"RPM-Faktor: \"); Serial.print(cal.rpmFactor, 4);\r\n    Serial.print(\" | Speed-Faktor: \"); Serial.print(cal.speedFactor, 4);\r\n    Serial.print(\" | Status: \"); Serial.println(cal.locked ? \"GESPERRT\" : \"LIVE\");\r\n  }\r\n}"}];

/* ---------- Graph-Logik (DOM-frei, testbar) ---------- */
function buildAdj(g) {
  var out = {}, inp = {};
  g.edges.forEach(function (e) {
    (out[e.von] = out[e.von] || []).push(e);
    (inp[e.nach] = inp[e.nach] || []).push(e);
  });
  return { out: out, inp: inp };
}
function bfsUp(g, start) {
  var adj = buildAdj(g), seen = {}, q = [start], order = [];
  seen[start] = 0;
  var via = {};
  while (q.length) {
    var cur = q.shift(); order.push(cur);
    var ins = adj.inp[cur] || [];
    for (var i = 0; i < ins.length; i++) {
      var v = ins[i].von;
      if (!(v in seen)) { seen[v] = seen[cur] + 1; via[v] = { von: v, nach: cur, e: ins[i] }; q.push(v); }
    }
  }
  return { order: order, dist: seen, via: via };
}
function bfsDown(g, start) {
  var adj = buildAdj(g), seen = {}, q = [start], order = [];
  seen[start] = 0;
  var via = {};
  while (q.length) {
    var cur = q.shift(); order.push(cur);
    var outs = adj.out[cur] || [];
    for (var i = 0; i < outs.length; i++) {
      var n = outs[i].nach;
      if (!(n in seen)) { seen[n] = seen[cur] + 1; via[n] = { von: cur, nach: n, e: outs[i] }; q.push(n); }
    }
  }
  return { order: order, dist: seen, via: via };
}
function nodeById(g, id) {
  for (var i = 0; i < g.nodes.length; i++) if (g.nodes[i].id === id) return g.nodes[i];
  return null;
}
/* Geschwister: teilen mind. einen Vorgaenger oder Nachfolger */
function zweige(g, id) {
  var adj = buildAdj(g), sib = {}, out = [];
  var pred = {}, succ = {};
  (adj.inp[id] || []).forEach(function (e) { pred[e.von] = 1; });
  (adj.out[id] || []).forEach(function (e) { succ[e.nach] = 1; });
  g.edges.forEach(function (e) {
    if (e.von !== id && (pred[e.von])) sib[e.nach] = sib[e.nach] || e.von;
    if (e.nach !== id && (succ[e.nach])) sib[e.von] = sib[e.von] || e.nach;
  });
  delete sib[id];
  for (const k in sib) out.push(k);
  out.sort();
  return out;
}

var EXTERN_TYP = {
  'Kl.15': 'Versorgung', 'Kl.31': 'Masse', 'Kl.X': 'Versorgung',
  'Radio': 'Komfort', 'Radio (GALA)': 'Komfort', 'Tempomat': 'Komfort', 'Tempomat (GRA)': 'Komfort',
  'GALA': 'Komfort', 'Kombi (MIL)': 'Anzeige', 'ABS-Lampe': 'Anzeige', 'Warnleuchte': 'Anzeige',
  'OBD:7': 'Diagnose', 'OBD:15': 'Diagnose', 'J102': 'Relais', 'Relais:3': 'Relais',
  'Relais:12': 'Relais', 'Relais:79': 'Relais', 'G44': 'Sensor', 'G45': 'Sensor',
  'G46': 'Sensor', 'G47': 'Sensor', 'G100': 'Sensor', 'G101': 'Sensor'
};
function externTyp(id, label) {
  if (EXTERN_TYP[id]) return EXTERN_TYP[id];
  if (/^Si\.|^S\d/.test(id)) return 'Sicherung';
  if (/^Relais|^J\d/.test(id)) return 'Relais';
  if (/^G\d/.test(id)) return 'Sensor';
  if (/^N\d|^V/.test(id)) return 'Aktor';
  if (/^Kl\./.test(id)) return 'Versorgung';
  if (/Masse/i.test(label || '')) return 'Masse';
  if (/OBD|Diagnose|K-Line/i.test((label || '') + id)) return 'Diagnose';
  return 'Extern';
}
function kantenWarnung(e) {
  var s = (e.signal || '') + ' ' + (e.quelle || '');
  if (/KONFLIKT/i.test(s)) return 'KONFLIKT';
  if (/unbest/i.test(s)) return 'unbestätigt';
  if (/ANNAHME/i.test(s)) return 'Annahme';
  return '';
}
function pfadAnalyse(g, id) {
  var n = nodeById(g, id);
  if (!n) return { fehler: 'Knoten unbekannt: ' + id };
  var up = bfsUp(g, id), down = bfsDown(g, id);
  var adj = buildAdj(g);
  var ext = [];
  var seen = {};
  (adj.inp[id] || []).concat(adj.out[id] || []).forEach(function (e) {
    [e.von, e.nach].forEach(function (x) {
      if (x === id || seen[x]) return;
      var xn = nodeById(g, x);
      if (xn && xn.tab === 'extern') { seen[x] = 1; ext.push({ id: x, typ: externTyp(x, xn.label), label: xn.label }); }
    });
  });
  return { knoten: n, herkunft: up, verlauf: down, zweige: zweige(g, id), extern: ext, intern: TACHO_INTERN[id] || '' };
}

function pad2(s) { s = String(s); return s.length < 2 ? '0' + s : s; }
function sgPinZuKnoten(sgId, pin) {

  else if (sgId === 27) {
    var m = p.match(/^([A-Za-z]+\d*)\/(\d+)(.*)$/);
    if (m && (m[1] === 'U1' || m[1] === 'U2') && m[2].length < 2) c = [m[1] + '/' + pad2(m[2]) + m[3]];
    else c = [p];
  }
  else if (sgId === 8) c = ['ECU:' + p, 'ECU:' + pad2(p)];
  else if (sgId === 9) c = ['MK02:' + p];
  else if (sgId === 10) { var n10 = (p.match(/\d+/) || [''])[0]; c = ['MK02:' + n10, 'MK04:' + n10]; }
  else if (sgId === 11) { var n11 = (p.match(/\d+/) || [''])[0]; c = ['MK04:' + n11]; }
  else if (sgId === 12) { var n12 = (p.match(/\d+/) || [''])[0]; c = ['MK20:' + n12]; }
  for (var i = 0; i < c.length; i++) if (nodeById(GRAPH, c[i])) return c[i];
  return '';
}
/* FAKTOR-Rechner (Formel aus signalpfad.html) */
function faktorRechner(umfang, zaehne, k) {
  if (!(umfang > 0 && zaehne > 0 && k > 0)) return { fehler: 'Bitte gueltige Werte eingeben.' };
  var f = (k * 4) / (zaehne * 1000 / umfang);
  var hz = (100 / 3.6) / umfang * zaehne * f;

}
/* SG-Statistik */
function sgStatistik() {
  var per = {};

  return { sg: SG_DATEN.sg.length, pins: SG_DATEN.pinouts.length, proSg: per, knoten: GRAPH.nodes.length, kanten: GRAPH.edges.length };
}

var FAHRZEUG_KEY = 'vw-fz-v1';

    { id: 'wfs1', label: 'Wegfahrsperre Gen 1', sg: [15] },
    { id: 'wfs2', label: 'Wegfahrsperre Gen 2', sg: [16] },
    { id: 'wfs3', label: 'Wegfahrsperre Gen 3', sg: [17] },
    { id: 'airbag3', label: 'Airbag Golf 3', sg: [18] },
    { id: 'airbag4', label: 'Airbag Golf 4', sg: [19] }
  ] }
];
var FAHRZEUG_DEFAULT = { motor: 'm29', abs: 'mk02eds', getriebe: 'manuell', extras: [] };
var FAHRZEUG_IMMER = [26, 27]; /* Tacho T28 + ZE2 */
function fahrzeugZuSg(cfg) {
  var out = FAHRZEUG_IMMER.slice(), seen = {};
  out.forEach(function (id) { seen[id] = 1; });
  FAHRZEUG_GRUPPEN.forEach(function (g) {
    var v = cfg ? cfg[g.id] : undefined;
    if (v === undefined) v = FAHRZEUG_DEFAULT[g.id];
    var ids = [];
    if (g.typ === 'single') {
      g.optionen.forEach(function (o) { if (o.id === v) ids = o.sg; });
    } else {
      (v || []).forEach(function (vid) {
        g.optionen.forEach(function (o) { if (o.id === vid) ids = ids.concat(o.sg); });
      });
    }
    ids.forEach(function (id) { if (!seen[id]) { seen[id] = 1; out.push(id); } });
  });
  out.sort(function (a, b) { return a - b; });
  return out;
}
/* Verarbeiten: Auswahl -> fertiges Ergebnis-Modell */
function baueErgebnis(selIds) {
  var selSet = {};
  (selIds || []).forEach(function (id) { selSet[id] = 1; });
  var sgs = SG_DATEN.sg.filter(function (s) { return selSet[s.id]; });
  var pins = SG_DATEN.pinouts.filter(function (p) { return selSet[p.steuergeraet_id]; });
  var pruef = [];
  function hatKnoten(id) { return !!nodeById(GRAPH, id); }
  var vssKette = ['G1/11', 'U1/11', 'T28/27', 'T28/07', 'U2/02', 'ECU:65'];
  var fehlt = vssKette.filter(function (k) { return !hatKnoten(k); });
  pruef.push({ id: 'vss', titel: 'VSS-Signalkette', ok: fehlt.length === 0,
    text: fehlt.length ? 'Fehlt im Graph: ' + fehlt.join(', ') : 'G1/11 → U1/11 → T28/27 → T28/07 → U2/02 → ECU:65 vollständig' });
  var dzm = ['ECU:22', 'G1/12', 'U1/06', 'T28/10'].filter(function (k) { return !hatKnoten(k); });
  pruef.push({ id: 'dzm', titel: 'Drehzahlsignal', ok: dzm.length === 0,
    text: dzm.length ? 'Fehlt im Graph: ' + dzm.join(', ') : 'ECU:22 → G1/12 → U1/06 → T28/10 vollständig' });
  var mfa = ['ECU:51', 'T28/26'].filter(function (k) { return !hatKnoten(k); });
  pruef.push({ id: 'mfa', titel: 'MFA-Verbrauchssignal', ok: mfa.length === 0,
    text: mfa.length ? 'Fehlt im Graph: ' + mfa.join(', ') : 'ECU:51 → T28/26 vollständig' });
  return { anzahlSg: sgs.length, anzahlPins: pins.length, sgs: sgs, pins: pins, pruefungen: pruef };
}

if (typeof module !== 'undefined') {
  module.exports = { SG_DATEN: SG_DATEN, GRAPH: GRAPH, bfsUp: bfsUp, bfsDown: bfsDown, zweige: zweige, pfadAnalyse: pfadAnalyse, sgPinZuKnoten: sgPinZuKnoten, faktorRechner: faktorRechner, sgStatistik: sgStatistik, kantenWarnung: kantenWarnung, FIRMWARE_INO: FIRMWARE_INO, FAHRZEUG_KEY: FAHRZEUG_KEY, FAHRZEUG_GRUPPEN: FAHRZEUG_GRUPPEN, FAHRZEUG_DEFAULT: FAHRZEUG_DEFAULT, FAHRZEUG_IMMER: FAHRZEUG_IMMER, fahrzeugZuSg: fahrzeugZuSg, baueErgebnis: baueErgebnis };
}

</script>
<script>
/* UI-Schicht – gefuehrter Assistent: 1 Fahrzeug, 2 Steuergeraete, 3 Verarbeiten, 4 Ergebnis */
(function () {
if (typeof document === 'undefined') return;
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
function badge(txt, cls) { return '<span class="badge ' + cls + '">' + esc(txt) + '</span>'; }
/* Sicherheits-Markierung: nur ⚠ wenn unbestätigt/Annahme/Konflikt (keine Herkunftsangaben) */
function safetyMark(p) {
  var t = ((p && p.hinweis) || '') + ' ' + ((p && p.funktion) || '') + ' ' + ((p && p.konfidenz) || '');
  if (/KONFLIKT/i.test(t)) return ' ' + badge('⚠ Konflikt – prüfen!', 'b-unbest');
  if (/unbest|UNBELEGT|Annahme|ANNAHME|NIEDRIG/i.test(t)) return ' ' + badge('⚠ prüfen', 'b-unbest');
  return '';
}
function nodeLink(id) { return '<button class="nl" data-node="' + esc(id) + '">' + esc(id) + '</button>'; }

var SCHRITTE = ['1 · Fahrzeug', '2 · Steuergeräte', '3 · Verarbeiten', '4 · Ergebnis'];
var q = document.getElementById('q'), tabsEl = document.getElementById('tabs'), mainEl = document.getElementById('main');
var STORE_KEY = 'vw-assistent-v1';
var state = { step: 0, cfg: JSON.parse(JSON.stringify(FAHRZEUG_DEFAULT)), sel: [], selSg: null, selNode: null, checkState: {}, gebaut: false };
try {
  var saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
  if (saved && saved.cfg) state = saved;
} catch (e) {}
if (!state.cfg) state.cfg = JSON.parse(JSON.stringify(FAHRZEUG_DEFAULT));
if (!state.sel || !state.sel.length) state.sel = fahrzeugZuSg(state.cfg);
function speichern() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }
function sgById(id) { for (var i = 0; i < SG_DATEN.sg.length; i++) if (SG_DATEN.sg[i].id === id) return SG_DATEN.sg[i]; return null; }
function pinCount(id) { var n = 0; SG_DATEN.pinouts.forEach(function (p) { if (p.steuergeraet_id === id) n++; }); return n; }
function matchQ(s) { var t = q.value.trim().toLowerCase(); if (!t) return true; return String(s).toLowerCase().indexOf(t) >= 0; }
function go(n) { state.step = n; speichern(); render(); window.scrollTo(0, 0); }

function renderSteps() {
  var h = '';
  SCHRITTE.forEach(function (t, i) {
    var cls = 'tab-btn' + (state.step === i ? ' active' : '') + (i === 3 && !state.gebaut ? ' disabled' : '');
    h += '<button role="tab" aria-selected="' + (state.step === i ? 'true' : 'false') + '" class="' + cls + '" data-step="' + i + '">' + t + '</button>';

}

/* ---- Schritt 1: Fahrzeugauswahl ---- */
function renderFahrzeug() {
  var h = '<div class="card"><h2>Dein Fahrzeug – was ist verbaut?</h2>' +
    '<p class="mut">Wähle Motor, ABS, Getriebe und Ausstattung. Daraus werden automatisch die relevanten Steuergeräte bestimmt (nächster Schritt).</p></div>';
  FAHRZEUG_GRUPPEN.forEach(function (g) {
    h += '<div class="card"><h2>' + esc(g.titel) + '</h2><div class="opts">';
    g.optionen.forEach(function (o) {
      var aktiv = g.typ === 'single' ? (state.cfg[g.id] === o.id) : ((state.cfg[g.id] || []).indexOf(o.id) >= 0);
      h += '<button class="opt' + (aktiv ? ' active' : '') + '" data-grp="' + g.id + '" data-opt="' + o.id + '">' + esc(o.label) + '</button>';
    });
    h += '</div></div>';
  });
  var auto = fahrzeugZuSg(state.cfg);
  h += '<div class="card"><h2>Vorschau: ' + auto.length + ' Steuergeräte erkannt</h2><div>' +
    auto.map(function (id) { var s = sgById(id); return s ? '<span class="chip">' + esc(s.name) + '</span>' : ''; }).join('') +
    '</div><button class="calc" data-weiter>Weiter zu den Steuergeräten →</button></div>';
  mainEl.innerHTML = h;
  mainEl.querySelectorAll('[data-grp]').forEach(function (b) {
    b.onclick = function () {
      var g = FAHRZEUG_GRUPPEN.filter(function (x) { return x.id === b.dataset.grp; })[0];
      if (g.typ === 'single') state.cfg[g.id] = b.dataset.opt;
      else {
        var arr = state.cfg[g.id] || (state.cfg[g.id] = []);

        if (ix >= 0) arr.splice(ix, 1); else arr.push(b.dataset.opt);

      state.sel = fahrzeugZuSg(state.cfg);
      state.gebaut = false;

}

/* ---- Schritt 2: Steuergeräte auswählen ---- */
function renderSteuergeraete() {
  var kats = {};
  SG_DATEN.sg.forEach(function (s) { (kats[s.kategorie] = kats[s.kategorie] || []).push(s); });
  var h = '<div class="card"><h2>Steuergeräte prüfen und anpassen</h2>' +
    '<p class="mut">Aus deiner Fahrzeugauswahl übernommen – hake an/ab, was wirklich verbaut ist. ' +
    badge(state.sel.length + ' gewählt', 'b-pins') + '</p>' +
    '<button class="kat-btn" data-alle>Alle wählen</button> ' +
    '<button class="kat-btn" data-auto>Aus Fahrzeug übernehmen</button> ' +
    '<button class="kat-btn" data-keine>Keine</button></div>';
  Object.keys(kats).sort().forEach(function (k) {
    h += '<div class="card"><h2>' + esc(k) + '</h2>';
    kats[k].forEach(function (s) {
      if (!matchQ(s.name + ' ' + (s.teilenummern || ''))) return;
      var an = state.sel.indexOf(s.id) >= 0;
      h += '<label class="chk' + (an ? ' done-chk' : '') + '"><input type="checkbox" data-sg="' + s.id + '"' + (an ? ' checked' : '') + '>' +
        '<span class="txt"><strong>' + esc(s.name) + '</strong> ' + badge(pinCount(s.id) + ' Pins', 'b-pins') +
        '<br><span class="mut small">' + esc([s.teilenummern, s.stecker].filter(Boolean).join(' · ')) + '</span></span></label>';
    });
    h += '</div>';
  });
  h += '<div class="card"><button class="calc" data-zurueck>← Fahrzeug</button> ' +
    '<button class="calc" data-weiter>Weiter zum Verarbeiten →</button></div>';

  mainEl.querySelectorAll('[data-sg]').forEach(function (c) {
    c.onchange = function () {
      var id = +c.dataset.sg, ix = state.sel.indexOf(id);
      if (c.checked && ix < 0) state.sel.push(id);
      if (!c.checked && ix >= 0) state.sel.splice(ix, 1);
      state.sel.sort(function (a, b) { return a - b; });
      state.gebaut = false;
      speichern(); render();
    };
  });
  mainEl.querySelectorAll('[data-alle]').forEach(function (b) { b.onclick = function () { state.sel = SG_DATEN.sg.map(function (s) { return s.id; }); state.gebaut = false; speichern(); render(); }; });
  mainEl.querySelectorAll('[data-keine]').forEach(function (b) { b.onclick = function () { state.sel = FAHRZEUG_IMMER.slice(); state.gebaut = false; speichern(); render(); }; });
  mainEl.querySelectorAll('[data-auto]').forEach(function (b) { b.onclick = function () { state.sel = fahrzeugZuSg(state.cfg); state.gebaut = false; speichern(); render(); }; });
  mainEl.querySelectorAll('[data-zurueck]').forEach(function (b) { b.onclick = function () { go(0); }; });
  mainEl.querySelectorAll('[data-weiter]').forEach(function (b) { b.onclick = function () { go(2); }; });
}

/* ---- Schritt 3: Verarbeiten ---- */
function renderVerarbeiten() {
  var erg = baueErgebnis(state.sel);
  var h = '<div class="card"><h2>Verarbeiten – deine Auswahl im Überblick</h2>' +
    '<p>' + badge(erg.anzahlSg + ' Steuergeräte', 'b-pins') + ' ' + badge(erg.anzahlPins + ' Pins', 'b-pins') + '</p><div>' +
    erg.sgs.map(function (s) { return '<span class="chip">' + esc(s.name) + '</span>'; }).join('') + '</div></div>';
  h += '<div class="card"><h2>Signalprüfung</h2><table class="pins"><tr><th>Signal</th><th>Status</th></tr>';
  erg.pruefungen.forEach(function (p) {
    h += '<tr><td><strong>' + esc(p.titel) + '</strong><br><span class="mut small">' + esc(p.text) + '</span></td>' +
      '<td>' + (p.ok ? badge('✓ OK', 'b-pins') : badge('⚠ Lücke', 'b-unbest')) + '</td></tr>';
  });
  h += '</table></div>';
  h += '<div class="card"><button class="calc" data-zurueck>← Steuergeräte</button> ' +
    '<button class="calc" data-bauen>Fertiges Pinout erstellen →</button></div>';

  mainEl.querySelectorAll('[data-zurueck]').forEach(function (b) { b.onclick = function () { go(1); }; });

}

/* ---- Schritt 4: fertiges interaktives Pinout ---- */
function sgDetailZuKnoten(nid) {
  for (var i = 0; i < SG_DATEN.pinouts.length; i++) {
    var p = SG_DATEN.pinouts[i];
    if (sgPinZuKnoten(p.steuergeraet_id, p.pin) === nid) return p;
  }
  return null;
}
function kantenTabelle(liste, richtung) {
  if (!liste.length) return '<div class="empty">–</div>';
  var h = '<table class="pins"><tr><th>' + (richtung === 'up' ? 'Von' : 'Nach') + '</th><th>Signal</th></tr>';
  liste.forEach(function (x) {
    var other = richtung === 'up' ? x.e.von : x.e.nach;
    h += '<tr><td>' + nodeLink(other) + '</td><td>' + esc(x.e.signal || '–') + '</td></tr>';
  });
  return h + '</table>';
}
function renderErgebnis() {
  var erg = baueErgebnis(state.sel);
  var h = '<div class="card result-head"><h2>Fertiges Pinout: ' + erg.anzahlSg + ' Steuergeräte · ' + erg.anzahlPins + ' Pins</h2>' +
    '<p class="mut">Suche oben filtern · jeder Pin mit Verknüpfung öffnet seinen Signalpfad weiter unten.</p>' +
    '<div class="kats"><button class="kat-btn" data-goto="sec-pins">Pinbelegung</button>' +
    '<button class="kat-btn" data-goto="sec-pfad">Signalpfad</button>' +

    '<button class="kat-btn" data-goto="sec-rechner">Rechner</button>' +

    if (!pins.length && q.value.trim()) return;

    if (!pins.length) { h += '<div class="hint">Nur Stammdaten – keine Pin-Tabelle. Vor Verdrahtung am Fahrzeug prüfen.</div>'; return; }

    pins.forEach(function (p) {
      var kn = sgPinZuKnoten(s.id, p.pin);

    '<p class="mut">HERKUNFT = alle vorgeschalteten Stationen · VERLAUF = alle nachgeschalteten · ZWEIGE = Geschwisterknoten.</p>' +
    '<div class="crumbs">' + treffer.map(function (n) { return '<button class="crumb' + (state.selNode === n.id ? ' sel' : '') + '" data-node="' + esc(n.id) + '">' + esc(n.id) + '</button>'; }).join('<span class="arrow">·</span>') + '</div>';
  if (!state.selNode) h += '<div class="empty">Knoten wählen – z. B. T28/27 (VSS-Eingang), T28/07 (VSS-Ausgang) oder ECU:65.</div>';

      h += kantenTabelle((adj.inp[state.selNode] || []).map(function (e) { return { e: e }; }), 'up');
      h += '<h3>VERLAUF (' + dnIds.length + ' Stationen)</h3>';
      h += '<div class="crumbs">' + (dnIds.length ? dnIds.map(nodeLink).join('<span class="arrow">→</span>') : '<span class="mut">keine (Senke)</span>') + '</div>';
      h += kantenTabelle((adj.out[state.selNode] || []).map(function (e) { return { e: e }; }), 'down');
      if (a.zweige.length) h += '<h3>ZWEIGE (' + a.zweige.length + ')</h3><div class="crumbs">' + a.zweige.map(nodeLink).join('<span class="arrow">·</span>') + '</div>';
      if (a.extern.length) h += '<h3>Externe Anschlüsse</h3><div>' + a.extern.map(function (x) { return nodeLink(x.id) + ' ' + badge(x.typ, 'b-ext'); }).join(' ') + '</div>';
    }
  }
  h += '</div>';

  /* VSS-Lösungen */
  h += '<div class="card" id="sec-vss"><h2>VSS-Lösung</h2>';
  VSS_OPTS.forEach(function (o) {
    h += '<div class="card"><h3>' + esc(o.titel) + '</h3><div>' + badge(o.schwierigkeit, 'b-pins') + ' ' + badge(o.kosten, 'b-stamm') + '</div>' +
      '<p>' + esc(o.beschreibung) + '</p><p class="warn">' + badge('Voraussetzung', 'b-annahme') + ' ' + esc(o.voraussetzung) + '</p>';
    if (o.teile && o.teile.length) {
      h += '<h3>Teile</h3><table class="pins"><tr><th>Bauteil</th><th>Nummer</th><th>Preis</th></tr>';
      o.teile.forEach(function (t) { h += '<tr><td>' + esc(t.bezeichnung) + '</td><td>' + esc(t.teilenummer) + '</td><td>' + esc(t.preis) + '</td></tr>'; });
      h += '</table>';
    }
    if (o.schritte && o.schritte.length) {
      h += '<h3>Schritte</h3>';
      o.schritte.forEach(function (s) { h += '<div class="step"><b>' + s.nr + '.</b> ' + esc(s.text) + (s.kabel ? '<div class="mono">Verkabelung: ' + esc(s.kabel) + '</div>' : '') + '</div>'; });
    }
    h += '</div>';
  });
  h += '</div>';

  /* Rechner */
  h += '<div class="card" id="sec-rechner"><h2>FAKTOR-Rechner</h2>' +
    '<p class="mut">k = 960 ist eine Annahme – per GPS verifizieren!</p>' +
    '<label>Reifenumfang (m), z. B. 195/50R15 ≈ 1,83</label><input id="circ" type="number" step="0.001" value="1.83">' +
    '<label>Zähnezahl ABS-Ring (VA)</label><input id="teeth" type="number" step="1" value="45">' +
    '<label>k-Zahl Tacho (Annahme)</label><input id="kval" type="number" step="1" value="960">' +
    '<button class="calc" id="calcBtn">Berechnen</button><div class="result" id="calcOut">–</div></div>';
  h += '<div class="card"><h2>Drehzahl- und MFA-Prüfung</h2><table class="pins"><tr><th>Von</th><th>Nach</th><th>Sollwert</th></tr>' +
    '<tr><td>' + nodeLink('ECU:22') + '</td><td>→ ' + nodeLink('T28/10') + '</td><td>Drehzahlsignal via G1/12, U1/06</td></tr>' +
    '<tr><td>' + nodeLink('ECU:51') + '</td><td>→ ' + nodeLink('T28/26') + '</td><td>Verbrauchssignal MFA (direkt)</td></tr></table>' +
    '<p class="warn">6-Zylinder-ECU an 4-Zylinder-DZM → 6→4-Wandler nötig, sonst falsche Anzeige!</p></div>';

  /* Checkliste + Failsafe */
  var CHECKS = ['Geber 321907345B: Weiß-Gelb Durchgang', 'G1/11: Signal an ZE', 'U1/11 intern: Durchgang',
    'T28/27 Blau-Weiß: Rechteck EINGANG', 'Tacho k=960 prüfen (Annahme – per GPS gegenmessen)',
    'T28/07 Violett: AUSGANG', 'U2/02: Verteiler Durchgang', 'ECU Pin 65 Blau-Weiß: Signal',
    'Tempomat: GRA übernimmt', 'Radio W/1 Weiß-Gelb: GALA'];
  var done = CHECKS.filter(function (_, i) { return state.checkState[i]; }).length;
  h += '<div class="card" id="sec-check"><h2>Checkliste ' + done + '/' + CHECKS.length + '</h2><div class="prog"><div style="width:' + (done / CHECKS.length * 100) + '%"></div></div><div id="checks"></div>' +
    '<button class="calc" id="resetBtn" style="background:#222;color:#bbb">Fortschritt zurücksetzen</button></div>';
  h += '<div class="card"><h2>Wichtig – vor Verdrahtung lesen</h2><table class="pins"><tr><th>Hinweis</th></tr>';
  ['Arduino-Masse (5V) und Bordnetz-Masse (12V) NICHT verbinden – galvanisch getrennt (PC817), sonst Masseschleifen/Spannungsspitzen.',
   'ABS-Geberpaar nur hochohmig abgreifen, verdrillt lassen, KEINEN Leiter auf Masse legen.',
   'ECU nur über Standard-Pfad T28/07 → U2/02 → ECU:65 versorgen.',
   'GALA-12V an Kl.15 über Si. 16 (15A) absichern; Masse an Karosserie.',
   'VR6-DZM (ECU:22) braucht 6→4-Zylinder-Wandler – ohne Wandler keine Anzeige.',
   'Mk04 Ventil-Rückleitungen: KEIN Dauerplus, nicht auf 12 V legen (Kurzschlussgefahr).',
   'k=960 und ~107 Hz @100 km/h sind ANNAHMEN – per GPS gegenmessen.',
   'Mk02 Pin 19 (VSS) ist UMSTRITTEN – am Fahrzeug verifizieren.',
   'Airbag: NIEMALS an Zünderpins messen/prüfen.',
   'Alle Angaben ohne Gewähr – vor Verdrahtung gegenmessen.'
  ].forEach(function (f) { h += '<tr><td>' + esc(f) + '</td></tr>'; });
  h += '</table></div>';

  /* Sicherungen/Relais + Firmware */
  h += '<div class="card"><h2>Sicherungen (ZE2, 22)</h2><table class="pins"><tr><th>Nr.</th><th>A</th><th>Funktion</th></tr>';
  SI_LISTE.forEach(function (s) { h += '<tr><td>Si. ' + esc(s.nr) + '</td><td>' + esc(s.amp) + '</td><td>' + esc(s.funktion) + '</td></tr>'; });
  h += '</table><h2>Relaisplätze (24)</h2><table class="pins"><tr><th>Platz</th><th>Funktion</th></tr>';
  RELAIS_LISTE.forEach(function (r) { h += '<tr><td>' + esc(r.nr) + '</td><td>' + esc(r.funktion) + '</td></tr>'; });
  h += '</table></div>';
  h += '<div class="card" id="sec-fw"><h2>Firmware v1.0 (tacho.ino)</h2>' +
    '<p class="mut">SHA-256: <span class="mono">' + esc(FIRMWARE_SHA) + '</span> · ' + FIRMWARE_INO.split('\n').length + ' Zeilen · ' +
    '<button class="calc" id="fwCopy">Code kopieren</button> <a class="calc" id="fwDl" download="tacho.ino">tacho.ino laden</a></p>' +
    '<pre id="fwPre">' + esc(FIRMWARE_INO) + '</pre></div>';

  mainEl.innerHTML = h;
  mainEl.querySelectorAll('[data-goto]').forEach(function (b) {
    b.onclick = function () { var el = document.getElementById(b.dataset.goto); if (el) el.scrollIntoView(); };
  });
  mainEl.querySelectorAll('[data-edit]').forEach(function (b) { b.onclick = function () { go(1); }; });
  mainEl.querySelectorAll('[data-node]').forEach(function (b) {
    b.onclick = function () {
      state.selNode = b.dataset.node; speichern(); render();
      var el = document.getElementById('sec-pfad'); if (el) el.scrollIntoView();
    };
  });
  document.getElementById('calcBtn').onclick = function () {
    var r = faktorRechner(parseFloat(document.getElementById('circ').value), parseFloat(document.getElementById('teeth').value), parseFloat(document.getElementById('kval').value));
    document.getElementById('calcOut').textContent = r.fehler ? r.fehler : ('FAKTOR = ' + r.faktor.toFixed(4) + '  ·  Hz@100 km/h ≈ ' + r.hz.toFixed(1) + ' Hz');
  };
  var box = document.getElementById('checks');
  function renderChecks() {
    box.innerHTML = '';
    CHECKS.forEach(function (t, i) {
      var d = document.createElement('label'); d.className = 'chk' + (state.checkState[i] ? ' done' : '');
      var c = document.createElement('input'); c.type = 'checkbox'; c.checked = !!state.checkState[i];
      c.onchange = function () { state.checkState[i] = c.checked; speichern(); render(); };
      var s = document.createElement('span'); s.className = 'txt'; s.textContent = (i + 1) + '. ' + t;
      d.appendChild(c); d.appendChild(s); box.appendChild(d);
    });
  }
  renderChecks();
  document.getElementById('resetBtn').onclick = function () { state.checkState = {}; speichern(); render(); };
  document.getElementById('fwCopy').onclick = function () { if (navigator.clipboard) navigator.clipboard.writeText(FIRMWARE_INO); };
  document.getElementById('fwDl').href = 'data:text/plain;charset=utf-8,' + encodeURIComponent(FIRMWARE_INO);
}

function render() {
  renderSteps();
  q.style.display = state.step === 3 ? '' : 'none';
  if (state.step === 0) renderFahrzeug();
  else if (state.step === 1) renderSteuergeraete();
  else if (state.step === 2) renderVerarbeiten();
  else renderErgebnis();
  var st = sgStatistik();
  document.getElementById('stat').textContent = st.sg + ' Steuergeräte · ' + st.pins + ' Pins · ' + st.knoten + ' Knoten · ' + st.kanten + ' Kanten';
}
q.addEventListener('input', function () { if (state.step === 3) render(); });
document.addEventListener('keydown', function (e) {
  if (e.key === '/' && document.activeElement !== q && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); q.focus(); }
  else if (e.key === 'Escape') { q.value = ''; state.selNode = null; if (state.step === 3) render(); q.blur(); }
  else if (/^[1-4]$/.test(e.key) && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { var n = +e.key - 1; if (n === 3 && !state.gebaut) return; go(n); }
});
render();
})();

</script>
</body>
</html>
