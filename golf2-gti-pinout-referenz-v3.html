 Auf der Rückseite die Verschlusslasche der Tachowellen-Öffnung entfernen."},{nr:2,text:"Hallgeber 321 907 345 B einschrauben (M-Gewinde, selbstsichernd). Leiterfolie in den Tacho einstecken und befestigen.",kabel:"Kabel 1 (Braun): Masse | Kabel 2 (Rot): 12V Kl.15 | Kabel 3 (Weiß/Gelb): Signal"},{nr:3,text:"Signal-Kabel (Weiß/Gelb) an ZE G1/11 anschließen → intern zu U1/11 → T28/27 (VSS-Eingang Tacho).",kabel:"Weiß/Gelb → ZE G1/11 (Weiß/Blau) → U1/11 → T28/27"},{nr:4,text:"Dasselbe Signal-Kabel auch an ECU Pin 65 (Blau/Weiß) anschließen – parallel zum Tacho.",kabel:"Signal → ECU Pin 65 (Blau/Weiß) über ZE G1/11"},{nr:5,text:"12V (Rot) an Klemme 15 (Zündungsplus) anschließen. Masse (Braun) an Fahrzeugmasse.",kabel:"Rot → Si. 16 oder ZE U1/04 | Braun → Karosseriemasse"},{nr:6,text:"Tacho einbauen, Zündung EIN. Bei Fahrt: Tacho zeigt Geschwindigkeit, ECU-Messblock Gruppe 3 zeigt VSS-Wert."}]},{id:"arduino",titel:"Option B: Arduino Nano V3 (ATMega328P) – DIY VSS-Wandler",schwierigkeit:"Mittel",kosten:"~4–8 €",voraussetzung:"Arduino Nano V3 vorhanden. Keine Tachowelle nötig – liest ABS-Radsensor direkt.",beschreibung:"Der ABS-Radsensor (VR-Typ, passiv-induktiv) erzeugt eine Wechselspannung. Ein LM393-Komparator wandelt diese in ein 5V-Rechtecksignal um, das der Arduino liest. Der Arduino berechnet die Frequenz und gibt ein skaliertes 12V-Signal über einen BC547-Transistor aus. WICHTIG: Standard ATMega328P funktioniert – kein 328PB nötig!",teile:[{bezeichnung:"LM393 Komparator-IC (DIP-8)",teilenummer:"LM393N",preis:"~0,50 €"},{bezeichnung:"Widerstand 100 Ω (1/4W)",teilenummer:"–",preis:"~0,05 €"},{bezeichnung:"Widerstand 1 kΩ (1/4W) × 3",teilenummer:"–",preis:"~0,15 €"},{bezeichnung:"Widerstand 4,7 kΩ (1/4W)",teilenummer:"–",preis:"~0,05 €"},{bezeichnung:"Widerstand 10 kΩ (1/4W) × 3",teilenummer:"–",preis:"~0,15 €"},{bezeichnung:"Kondensator 100 nF Keramik",teilenummer:"–",preis:"~0,10 €"},{bezeichnung:"Transistor BC547 (NPN)",teilenummer:"BC547B",preis:"~0,10 €"},{bezeichnung:"Steckplatine (Breadboard) oder Lochrasterplatine",teilenummer:"–",preis:"~2,00 €"},{bezeichnung:"Schraubklemmen 2-polig 5mm × 3",teilenummer:"–",preis:"~1,00 €"}],schritte:[{nr:1,text:"LM393-Schaltung aufbauen: Sensor-Signal über 100nF-Kondensator an LM393 Pin 2 (IN-). 4,7kΩ Pull-up von 5V an Pin 2. Spannungsteiler 10kΩ/10kΩ von 5V nach GND an Pin 3 (IN+, Referenz 2,5V). Pin 1 (OUT) über 10kΩ Pull-up auf 5V an Arduino D2.",kabel:"LM393 Pin 8 → 5V | Pin 4 → GND | Pin 1 → 10kΩ → 5V → Arduino D2"},{nr:2,text:"Ausgangsstufe aufbauen: Arduino D9 über 1kΩ an BC547-Basis. BC547-Emitter an GND. BC547-Kollektor über 10kΩ Pull-up an 12V. Kollektor-Ausgang → T28/27 und ECU Pin 65. Pflicht: PC817-Optokoppler zur galvanischen Trennung zwischen Bordnetz (12 V) und Arduino – ohne Trennung drohen Schäden durch Masseschleifen/Spannungsspitzen!",kabel:"Arduino D9 → 1kΩ → BC547 Basis | Kollektor → 10kΩ → 12V | Kollektor → T28/27 + ECU Pin 65"},{nr:3,text:"Sensor anschließen: ABS-Sensor Kabel 1 (Signal/Braun) über 100nF an LM393 Pin 2. Sensor Kabel 2 (Masse/Braun-Weiß) an GND.",kabel:"ABS G47 Pin 5 (Braun) → 100nF → LM393 Pin 2 | ABS G47 Pin 1 (Braun/Weiß) → GND"},{nr:4,text:"Arduino versorgen: 12V über 7805-Spannungsregler an Arduino 5V-Pin (7805 liefert 5 V – NICHT an VIN, der braucht 7–12 V!). GND an Fahrzeugmasse.",kabel:"12V (Kl.15) → 7805 → Arduino 5V (NICHT VIN!) | GND → Fahrzeugmasse"},{nr:5,text:"Firmware auf Arduino laden (Code siehe unten). SKALIERUNGSFAKTOR anpassen: Standard 195/50R15 + 45 Zähne VA → FAKTOR = 0.156 (Tacho-Impulse / ABS-Impulse, s. Formel im Firmware-Kommentar)."},{nr:6,text:"Testen: Zündung EIN, Rad drehen → LED 13 auf Arduino blinkt. Bei Fahrt: Tacho zeigt Geschwindigkeit. ECU-Messblock Gruppe 3 prüfen."}],firmware:`// ================================================================
// VSS-Wandler: ABS VR-Sensor \u{2192} Golf 2 Tacho + ECU
// Hardware: Arduino Nano V3 (ATMega328P)
// Eingang: LM393-Komparator an D2 (Interrupt 0)
// Ausgang: BC547-Transistor an D9 (Open-Collector 12V)
// ================================================================

// ANPASSEN: Skalierungsfaktor
// Formel: FAKTOR = (k-Zahl \xd7 4) / (Z\xe4hne \xd7 1000/Reifenumfang_m)
// Beispiel 195/50R15 (Umfang 1.83m), 45 Z\xe4hne VA, k=960:
// FAKTOR = (960 \xd7 4) / (45 \xd7 1000/1.83) = 3840 / 24590 = 0.1561
// Reifen oder Zähnezahl abweichend? FAKTOR neu berechnen oder experimentell kalibrieren (GPS-Abgleich)!
const float FAKTOR = 0.156; // Startwert f\xfcr 195/50R15, 45 Z\xe4hne, k=960

// Mindestimpulsabstand (Entprellung), in Mikrosekunden
const unsigned long MIN_PULSE_US = 500;

volatile unsigned long lastPulseTime = 0;
volatile unsigned long pulseInterval = 0;
volatile bool newPulse = false;

void onPulse() {
  unsigned long now = micros();
  unsigned long dt = now - lastPulseTime;
  if (dt > MIN_PULSE_US) {
    pulseInterval = dt;
    lastPulseTime = now;
    newPulse = true;
  }
}

void setup() {
  pinMode(2, INPUT);          // LM393-Ausgang (Pull-up extern)
  pinMode(9, OUTPUT);         // Ausgang \u{2192} BC547 \u{2192} Tacho/ECU
  pinMode(13, OUTPUT);        // Status-LED
  attachInterrupt(0, onPulse, RISING); // D2 = INT0
  Serial.begin(9600);
}

void loop() {
  static unsigned long lastOutput = 0;
  static bool outputState = false;

  if (newPulse) {
    newPulse = false;
    // Eingangsfrequenz berechnen
    float freqIn = 1000000.0 / pulseInterval; // Hz
    // Ausgangsfrequenz skalieren
    float freqOut = freqIn * FAKTOR;
    // Ausgangsperiode in Mikrosekunden
    unsigned long halfPeriod = (freqOut > 0) ? (unsigned long)(500000.0 / freqOut) : 0;

    if (halfPeriod > 0 && halfPeriod < 50000) {
      unsigned long now = micros();
      if (now - lastOutput >= halfPeriod) {
        outputState = !outputState;
        digitalWrite(9, outputState ? HIGH : LOW);
        digitalWrite(13, outputState ? HIGH : LOW);
        lastOutput = now;
      }
    }

    // Debug-Ausgabe (auskommentieren f\xfcr Betrieb)
    // Serial.print("fIn:"); Serial.print(freqIn);
    // Serial.print(" fOut:"); Serial.println(freqOut);
  }

  // Timeout: kein Signal \u{2192} Ausgang LOW
  if (micros() - lastPulseTime > 500000UL) {
    digitalWrite(9, LOW);
    digitalWrite(13, LOW);
